[package]
name = "factur-x"
description = "Factur-X and ZUGFeRD hybrid e-invoices: EN 16931 CII and UBL generation, parsing, profile detection and validation."
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/factur-x"
authors.workspace = true
keywords = ["factur-x", "zugferd", "en16931", "e-invoice", "ubl"]
categories = ["encoding", "finance", "parser-implementations"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
xmlkit.workspace = true

[lints]
workspace = true
