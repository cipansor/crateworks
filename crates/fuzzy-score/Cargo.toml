[package]
name = "fuzzy-score"
description = "Fuzzy string matching scores compatible with Python's fuzzywuzzy: ratio, partial, token sort, token set and WRatio, plus extract and dedupe."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fuzzy-score"
authors.workspace = true
keywords = ["fuzzy", "fuzzywuzzy", "string-similarity", "matching", "dedupe"]
categories = ["text-processing"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
