[package]
name = "fuzzy-score"
description = "Fuzzy string matching scores compatible with Python's fuzzywuzzy, plus edit distances and Jaro-Winkler: ratio, partial, token sort, token set, WRatio, extract, dedupe, Levenshtein, Damerau-Levenshtein, OSA and Hamming."
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/fuzzy-score"
authors.workspace = true
keywords = ["fuzzy", "fuzzywuzzy", "levenshtein", "string-similarity", "dedupe"]
categories = ["text-processing"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
