[package]
name = "mllp"
description = "MLLP (Minimal Lower Layer Protocol) framing for HL7 v2 messages, with a streaming decoder and a message parser."
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mllp"
authors.workspace = true
keywords = ["mllp", "hl7", "hl7v2", "healthcare", "framing"]
categories = ["encoding", "parser-implementations", "network-programming"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
