[package]
name = "wssec"
description = "WS-Security headers: UsernameToken, timestamp, and password digests, for SOAP services that require them."
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/wssec"
authors.workspace = true
keywords = ["soap", "ws-security", "wsse", "authentication", "xml"]
categories = ["web-programming", "authentication"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
xmlkit.workspace = true

[lints]
workspace = true
