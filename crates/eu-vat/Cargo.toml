[package]
name = "eu-vat"
description = "Validation of European Union VAT identification numbers for all 27 member states plus Northern Ireland."
version = "0.1.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/eu-vat"
authors.workspace = true
keywords = ["vat", "tax", "validation", "eu", "checksum"]
categories = ["value-formatting", "finance"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
