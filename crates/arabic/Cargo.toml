[package]
name = "arabic"
description = "Arabic text shaping: contextual letter forms, ligatures, harakat handling and normalization."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/arabic"
authors.workspace = true
keywords = ["arabic", "shaping", "rtl", "ligature", "unicode"]
categories = ["text-processing", "internationalization"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
