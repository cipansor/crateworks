[package]
name = "xmlkit"
description = "Minimal, allocation-friendly XML reading and writing used across the crateworks workspace."
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/xmlkit"
authors.workspace = true
keywords = ["xml", "parser", "writer", "soap", "wsdl"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
