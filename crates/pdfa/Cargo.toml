[package]
name = "pdfa"
description = "PDF/A conformance: XMP metadata, embedded files, and the Factur-X container for e-invoices."
version = "0.1.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pdfa"
authors.workspace = true
keywords = ["pdf", "pdfa", "xmp", "factur-x", "einvoice"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
xmlkit.workspace = true

[lints]
workspace = true
