[package]
name = "aviation-data"
description = "Airport reference data: look up airports by IATA, ICAO, GPS or local code, search them, and measure the distance between them."
version = "0.1.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aviation-data"
authors.workspace = true
keywords = ["aviation", "airport", "iata", "icao", "geography"]
categories = ["data-structures", "science"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
