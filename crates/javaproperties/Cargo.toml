[package]
name = "javaproperties"
description = "Java .properties files: escapes, line continuations and the ISO-8859-1 default, read the way java.util.Properties reads them."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/javaproperties"
authors.workspace = true
keywords = ["properties", "java", "configuration", "i18n", "parser"]
categories = ["parser-implementations", "config"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The XML properties format (`java.util.Properties.loadFromXML`) is an XML
# document, and `xmlkit` in this workspace already parses one.
xmlkit.workspace = true

[lints]
workspace = true
