[package]
name = "ebics"
description = "EBICS 3.0 (H004): the XML messages and the RSA, AES and SHA-256 cryptography a corporate banking client needs."
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ebics"
authors.workspace = true
keywords = ["ebics", "banking", "iso20022", "sepa", "xml"]
categories = ["encoding", "cryptography", "finance", "parser-implementations"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
xmlkit.workspace = true

[lints]
workspace = true
