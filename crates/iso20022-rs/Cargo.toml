[package]
name = "iso20022-rs"
description = "ISO 20022 payment messages: parse and build pacs credit transfers and status reports, camt bank statements and pain payment initiation."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/iso20022-rs"
authors.workspace = true
keywords = ["iso20022", "payments", "banking", "sepa", "camt"]
categories = ["parser-implementations", "finance"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
xmlkit.workspace = true

[lints]
workspace = true
