[package]
name = "runits"
description = "Runtime unit conversion: parse and convert quantities written as text, such as \"3.5 kg\" to \"lb\", from a table compiled in from pint."
version = "0.1.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/runits"
authors.workspace = true
keywords = ["units", "unit-conversion", "measurement", "si", "pint"]
categories = ["science", "parser-implementations"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
