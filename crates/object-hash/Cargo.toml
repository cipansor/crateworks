[package]
name = "object-hash"
description = "A stable, cross-process hash of a structured value, byte-compatible with the object-hash npm package."
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/object-hash"
authors.workspace = true
keywords = ["hash", "hashing", "cache-key", "etag", "content-addressing"]
categories = ["algorithms", "cryptography"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
