[package]
name = "pades"
description = "PAdES PDF signatures: read a signed document, check what it covers, and report how far its long-term validation reaches."
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pades"
authors.workspace = true
keywords = ["pades", "pdf", "signature", "cades", "ltv"]
categories = ["parser-implementations", "cryptography", "encoding"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
pdfa.workspace = true

[lints]
workspace = true
