[package]
name = "cssprint"
description = "Lay out HTML and CSS for paged output, in pure Rust: the box model and block layout, checked against WeasyPrint's own box tree."
version = "0.1.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cssprint"
authors.workspace = true
keywords = ["css", "layout", "html", "pdf", "print"]
categories = ["web-programming", "rendering"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dev-dependencies]

[lints]
workspace = true
