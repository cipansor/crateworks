[package]
name = "hijridate"
description = "Hijri (Islamic) and Gregorian date conversion using the Umm al-Qura calendar."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hijridate"
authors.workspace = true
keywords = ["hijri", "islamic", "calendar", "ummalqura", "date"]
categories = ["date-and-time"]
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs builds every feature so nothing is missing from the published docs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[lints]
workspace = true
